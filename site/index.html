<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 变现雷达</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#f6f7fb;color:#1a1f36;line-height:1.6}
.hero{background:linear-gradient(135deg,#0f172a 0%,#1e3a5f 50%,#3730a3 100%);color:#fff;padding:64px 24px 48px;text-align:center}
.hero h1{font-size:36px;font-weight:800;letter-spacing:2px;margin-bottom:12px}
.hero p{opacity:.85;font-size:15px}
.wrap{max-width:900px;margin:0 auto;padding:40px 20px 60px}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:28px;margin-bottom:20px;display:block;text-decoration:none;color:inherit;transition:.2s}
a.card:hover{transform:translateY(-3px);box-shadow:0 10px 30px rgba(30,27,75,.12);border-color:#3730a3}
.card h2{font-size:20px;font-weight:800;margin-bottom:6px}
.card .en{font-size:13px;color:#6b7280;margin-bottom:14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stat{background:#f1f3f9;border-radius:12px;padding:14px;text-align:center}
.stat-num{font-size:26px;font-weight:800;color:#3730a3}
.stat-label{font-size:12px;color:#6b7280;margin-top:4px}
.go{display:inline-block;margin-top:16px;font-size:13px;font-weight:600;color:#3730a3}
.skills h3{font-size:16px;font-weight:800;margin:8px 0 12px}
.skill-day{display:flex;justify-content:space-between;padding:8px 4px;border-bottom:1px dashed #e5e7eb;font-size:13.5px}
.skill-day .n{color:#6b7280}
.foot{text-align:center;color:#6b7280;font-size:12px;padding:24px}
</style>
</head>
<body>
<header class="hero">
  <h1>AI 变现雷达</h1>
  <p>监控 AI 玩法与自媒体成长信号 · S/A/B/C 智能分级 · 高价值方法论自动沉淀</p>
</header>
<main class="wrap">
  <a class="card" href="radar/index.html">
    <h2>每日信号仪表盘</h2>
    <div class="en">Daily Signals · 最近更新 2026-09-20</div>
    <div class="stats"><div class="stat"><div class="stat-num">30</div><div class="stat-label">AI 工具与变现</div></div><div class="stat"><div class="stat-num">30</div><div class="stat-label">自媒体与个人成长</div></div><div class="stat"><div class="stat-num">60</div><div class="stat-label">总条数</div></div></div>
    <span class="go">进入仪表盘 →</span>
  </a>
  <div class="card skills">
    <h3>技能沉淀库（25 篇）</h3>
    <div class="en">每日 S/A 级内容自动蒸馏为可复用技能笔记，存于仓库 skills/ 目录</div>
    <div class="skill-day"><span class="d">2026-09-20</span><span class="n">5 篇</span></div><div class="skill-day"><span class="d">2026-09-19</span><span class="n">5 篇</span></div><div class="skill-day"><span class="d">2026-09-18</span><span class="n">15 篇</span></div>
  </div>
</main>
<footer class="foot">AI Radar · 由 GitHub Actions 每日自动构建</footer>
</body>
</html>
