name: AI Radar Daily Build

on:
  schedule:
    # 23:00 UTC = 07:00 Beijing time (凌晨采集，上班前可看)
    - cron: '0 23 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ai-radar
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch & grade & render
        working-directory: scripts
        env:
          RADAR_BASE_URL: ${{ vars.RADAR_BASE_URL }}
          RADAR_API_KEY: ${{ secrets.RADAR_API_KEY }}
          RADAR_MODEL: ${{ vars.RADAR_MODEL }}
        continue-on-error: true
        run: python fetch_radar.py

      - name: Build index
        working-directory: scripts
        run: python build_index.py

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/ skills/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(radar): auto-update [$(TZ='Asia/Shanghai' date +%Y-%m-%d)]"
            git push
          fi

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
